spring.config.import=optional:classpath:application-test.properties
spring.jpa.defer-datasource-initialization=true

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:dailydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

# JWT Token Configuration
api.security.token.secret=a2a6d8a8fabe3a5f3a3a7f9b3a5b3a5b3a5b3a5b3a5b3a5b3a5b3a5b3a5b3a5b
api.security.token.expiration-minutes=60
